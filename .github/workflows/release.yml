name: "Publish Linux AppImage Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # <-- MAGIE 1: Cacht node_modules automatisch über package-lock.json!
          cache-dependency-path: elysium-ui/package-lock.json

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Rust Compiler Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "elysium-ui/src-tauri -> target" # Stellt sicher, dass das Tauri-Target exakt getroffen wird

      # MAGIE 2: Cacht die Apt-System-Pakete
      - name: Cache Apt Packages
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend & Build Dependencies
        run: npm ci # <-- Nutzt 'npm ci' statt 'npm install' (viel schneller & deterministisch)
        working-directory: elysium-ui
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle Frontend Assets
        run: node build-stage.cjs
        working-directory: elysium-ui
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build and Publish Tauri Linux AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          CARGO_BUILD_JOBS: 2
          NODE_OPTIONS: "--max-old-space-size=4096"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Elysium Linux ${{ github.ref_name }}"
          releaseBody: "Automated Linux production bundle compilation."
          releaseDraft: true
          prerelease: false
          projectPath: "elysium-ui"