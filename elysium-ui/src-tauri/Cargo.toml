[package]
name = "elysium"
version = "0.5.0"
description = "A music app written by node.js and Tauri/Rust."
authors = ["you"]
edition = "2021"

[lib]
# FIXED: Changed from _temp_lib to elysium_lib for clear production mapping
name = "elysium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2"
dirs = "5"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
futures-util = "0.3"
lofty = "0.21"
